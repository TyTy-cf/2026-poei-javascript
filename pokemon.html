<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Les Pokémons</title>
        <script src="script/pokemon.js"></script>
        <link href="./styles/main.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div class="container">
            <div class="row d-flex nav">
                <button type="button" class="col-2 left btn btn-danger">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <h1 class="col-8 text-center">Gen Pokemon</h1>
                <button type="button" class="col-2 right btn btn-danger">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            <div class="row form">
                <form name="search" class="d-flex flex-row justify-content-center align-items-center">
                    <label for="id_poke" class="me-1">Enter Pokemon ID here : </label>
                    <input type="number" id="id_poke" name="id_poke" min="1" max="151">
                    <button class="btn btn-secondary btn-search ms-1" type="button">
                        <i class="fa-solid fa-search"></i>
                    </button>
                </form>
            </div>
            <div class="row block-pokemons">

            </div>
        </div>
    </body>
</html>
