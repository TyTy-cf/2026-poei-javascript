<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Les exos du Vendredi</title>
        <script src="script/friday.js"></script>
        <link href="./styles/main.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div class="container my-5">
            <div class="profile-container my-5">
                <div class="d-flex">
                    <h1>My profile</h1>
                    <button class="btn btn-warning ms-auto">
                        Modifier
                        <i class="fa-solid fa-pen"></i>
                    </button>
                </div>
                <section class="mt-5 card-profile">
                    <div class="row">
                        <div class="col-12 col-md-3 d-flex flex-row align-items-center justify-content-center">
                            <img src="../images/pfp_irl.webp" alt="User PFP" class="pfp d-inline">
                        </div>
                        <div class="col-12 col-md-9 d-flex flex-column align-items-center justify-content-center mt-3">
                            <p>Name : <span>Valentin</span></p>
                            <p>Function : <span>Développeur Web</span></p>
                        </div>
                    </div>
                </section>
            </div>
            <form name="friday-form" method="post" class="d-none">
                <label for="name">Name :</label>
                <input name="name" class="form-control mt-1" type="text" placeholder="Name" autocomplete="off">
                <label for="function" class="mt-3">Function :</label>
                <input name="function" class="form-control mt-1" type="text" placeholder="Function" autocomplete="off">
                <label for="pfp" class="mt-3">New PFP :</label>
                <input name="pfp" class="form-control mt-1" type="file">
                <button class="btn btn-success mt-3">
                    Valider
                    <i class="fa-solid fa-check"></i>
                </button>
            </form>
        </div>
    </body>
</html>
