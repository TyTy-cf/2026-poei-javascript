<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Les exos du Vendredi</title>
        <script src="script/friday.js"></script>
        <link href="./styles/main.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div class="container my-5">
            <div class="profile-container my-5">
                <div class="d-flex">
                    <h1>My fake profile</h1>
                    <button class="btn btn-warning ms-auto">
                        Modifier
                        <i class="fa-solid fa-pen"></i>
                    </button>
                </div>
                <section>
                    <p>Name : <span>Sacha</span></p>
                    <p>Fonction : <span>Meilleur dresseur</span></p>
                </section>
            </div>
            <form name="friday-form" method="post">
                <input name="name" class="form-control" type="text" placeholder="Nom" autocomplete="off">
                <input name="function" class="form-control my-3" type="text" placeholder="Fonction" autocomplete="off">
                <button class="btn btn-success">
                    Valider
                    <i class="fa-solid fa-check"></i>
                </button>
            </form>
        </div>
    </body>
</html>
