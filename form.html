<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Form</title>
        <script src="script/dom.js"></script>
        <script src="script/dom_2.js"></script>
        <link href="./styles/main.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div class="container">
            <h1>Test change password input</h1>
            <form name="a-form" method="POST">
                <div class="btn-group mt-3">
                    <input type="password" class="form-control" id="password" name="password"  placeholder="Password" autocomplete="off">
                    <button class="btn btn-secondary" type="button">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <div class="btn-group mt-3">
                    <input type="password" class="form-control" id="confirm-password" name="confirm-password"  placeholder="Confirm password" autocomplete="off">
                    <button class="btn btn-secondary" type="button">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <button class="btn btn-primary">
                    Submit
                </button>
            </form>
        </div>
    </body>
</html>
